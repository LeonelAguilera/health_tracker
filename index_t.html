<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Metrics Tracking</title>
    <script src="https://unpkg.com/htmx.org@1.8.3"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Orbitron', sans-serif;
            display: grid;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #00ffff;
            font-size: 3em;
            text-shadow: 0 0 10px #00ffff;
			position: relative;	
        }
        button {
            background-color: #00ff00;
            border: none;
            color: #0d0d0d;
            padding: 10px 20px;
            font-size: 1.2em;
            cursor: pointer;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #000;
        }
        button:hover {
            background-color: #00cc00;
        }
        #form-container {
            background-color: #1a1a1a;
            padding: 20px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 10px #00ff00;
            margin-bottom: 20px;
        }
        label, input {
            display: block;
            margin: 10px 0;
        }
        input {
            background-color: #0d0d0d;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 5px;
        }
        input[type="submit"] {
            background-color: #00ff00;
            color: #0d0d0d;
            border: none;
            cursor: pointer;
            text-shadow: 0 0 5px #000;
        }
        input[type="submit"]:hover {
            background-color: #00cc00;
        }
        #graphs {
            align-items: center;
            justify-content: center;
        }
        .graph-container {
            align-items: center;
            justify-content: center;
			text-align: center;
            background-color: #1a1a1a;
            margin: 10px;
            padding: 10px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 10px #00ff00;
			max-width: "80";
        }
        .graph-container h3 {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }
		.graph-container img {
			display:block;
			z-index: 1;
			position: relative;	
			height: 50vh;
			width: auto;
			max-width: 80vw;
			margin: auto;
		}
    </style>
</head>
<body>
    <h1>Health Metrics Tracking</h1>
	<br>
    <button hx-target="body" hx-get="/new_data_form">Add New Data</button>
    
	<div id="graphs">
        <div class="graph-container">
            <h3>Weight</h3>
            <img src="graphs/peso.png" alt="weight graph" id="weight-graph">
        </div>
        <div class="graph-container">
            <h3>Visceral Fat</h3>
            <img src="graphs/grasa_visceral.png" alt="visceral fat graph" id="visceral_fat-graph">
        </div>
        <div class="graph-container">
            <h3>Fat</h3>
            <img src="graphs/grasa_corporal.png" alt="fat graph" id="fat-graph">
        </div>
        <div class="graph-container">
            <h3>Muscle</h3>
            <img src="graphs/musculo.png" alt="muscle graph" id="muscle-graph">
        </div>
        <div class="graph-container">
            <h3>Water</h3>
            <img src="graphs/agua.png" alt="water graph" id="water-graph">
        </div>
        <div class="graph-container">
            <h3>Protein</h3>
            <img src="graphs/proteina.png" alt="protein graph" id="protein-graph">
        </div>
        <div class="graph-container">
            <h3>Metabolism</h3>
            <img src="graphs/metabolismo_basal.png" alt="metabolism graph" id="metabolism-graph">
        </div>
        <div class="graph-container">
            <h3>Bone Mass</h3>
            <img src="graphs/masa_osea.png" alt="bone mass graph" id="bone_mass-graph">
        </div>
        <div class="graph-container">
            <h3>Hip Diameter</h3>
            <img src="graphs/diametro_cintura.png" alt="hip diameter graph" id="hip_diameter-graph">
        </div>
	</div>
</body>
</html>
