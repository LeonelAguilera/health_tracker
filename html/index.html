<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker</title>
    <link rel="stylesheet" href="styles/cyberpunk.css">
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <div class="container">
        <h1 class="title">Health Metrics Tracker</h1>
        <div class="button-group">
            <button class="button" hx-get="/scale_data" hx-target="#form-container" hx-swap="innerHTML">Track Weight</button>
            <button class="button" hx-get="/train_data" hx-target="#form-container" hx-swap="innerHTML">Track Training</button>
        </div>
        <div id="form-container" class="form-container">
            <!-- HTMX will load the content here -->
        </div>
    </div>
</body>
</html>
